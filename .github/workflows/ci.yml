name: CI

on:
  push:
    branches: [main]
    paths:
      - 'astro.config.mjs'
      - 'content.config.ts'
      - 'eslint.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'public/**'
      - 'src/**'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'astro.config.mjs'
      - 'content.config.ts'
      - 'eslint.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'public/**'
      - 'src/**'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint and Check
        run: pnpm test
