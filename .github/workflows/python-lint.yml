name: Python Lint

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'ia/pyproject.toml'
      - 'ia/uv.lock'
      - '.github/workflows/python-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'ia/pyproject.toml'
      - 'ia/uv.lock'
      - '.github/workflows/python-lint.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          cd ia
          uv sync --dev

      - name: Run ruff check
        run: |
          cd ia
          uv run ruff check .

      - name: Run ruff format check
        run: |
          cd ia
          uv run ruff format --check .
